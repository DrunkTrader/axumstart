[package]
name = "axumstart_components"
version = "0.1.3"
edition = "2024"
description = "Async dependency injection for Axum services: a typed component container, derive macros for registration, and an Inject<T> extractor"
license = "MIT"
repository = "https://github.com/axumstart/axumstart"

[dependencies]
parking_lot.workspace = true
axumstart_components_macros = { path = "macros", version = "0.1.3" }
axum.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
inventory.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
